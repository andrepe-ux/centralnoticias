<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutinário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2910/2910763.png" type="image/png">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        .card-3d {
            perspective: 1000px;
        }
        .card-inner {
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            transform-style: preserve-3d;
            transform-origin: center;
        }
        .card-3d:hover .card-inner {
            transform: rotateY(10deg) rotateX(10deg) scale(1.05);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .card-3d:hover::before {
            opacity: 0.2;
        }
        .card-3d::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top left, rgba(255,255,255,0.3), transparent);
            opacity: 0;
            border-radius: 1rem;
            transition: opacity 0.4s;
            pointer-events: none;
        }
        @media (max-width: 768px) {
            .card-3d:hover .card-inner {
                transform: none;
                box-shadow: none;
            }
        }
    </style>
</head>

<body class="bg-gray-100 flex flex-col min-h-screen">

</footer>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        feather.replace();
        updateClock();
        setInterval(updateClock, 1000);
    });

    function updateClock() {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const time = now.toLocaleTimeString('pt-BR');
        const date = now.toLocaleDateString('pt-BR', options);
        document.getElementById('clock').textContent = `${date} ${time}`;
    }
</script>
